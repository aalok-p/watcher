services:
  watcher:
    build: .
    container_name: watcher
    ports:
      - "8000:8000"
    environment:
      POLL_INTERVAL_SEC: 3
      SCREENSHOT_ENABLED: "true"
      PORT: 8000

      # GPU provider: nvidia (default), amd, intel, acer, or mock
      # Set by setup-windows.ps1 or .env
      GPU_PROVIDER: ${GPU_PROVIDER:-nvidia}

      # Oxlo AI config
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-oxlo-api-key-here}
      OPENAI_BASE_URL: https://api.oxlo.ai/v1
      OPENAI_MODEL: deepseek-r1-8b

    # GPU passthrough is injected via docker compose override file
    # See setup-windows.ps1 or setup-nvidia-gpu.sh for details

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
